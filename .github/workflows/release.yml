name: Release Image

on:
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]*.[0-9]*.[0-9]*'
  # Manual backfill for releases whose image was never built
  # (e.g. created while the workflow still triggered on the release event).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.5.1)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          # Docker tags without v prefix: full, major.minor, major, latest
          VER="${VERSION#v}"
          MAJOR="${VER%%.*}"
          MINOR="$(echo "$VER" | cut -d. -f1,2)"
          REPO="ghcr.io/odit-services/ghops"
          echo "TAGS=${REPO}:${VER},${REPO}:${MINOR},${REPO}:${MAJOR},${REPO}:latest" >> $GITHUB_OUTPUT

      - name: Build image for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          tags: ${{ steps.version.outputs.TAGS }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/odit-services/ghops:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          # Skip actions/cache (GHA cache hangs on self-hosted runners).
          # DB persists on runner disk via cache-dir instead.
          cache: 'false'
          cache-dir: /var/tmp/trivy-cache

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.version.outputs.TAGS }}

      - name: Generate Trivy vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/odit-services/ghops:latest
          format: json
          output: trivy-report.json
          exit-code: '0'
          skip-setup-trivy: true
          cache: 'false'
          cache-dir: /var/tmp/trivy-cache

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/odit-services/ghops:latest
          format: cyclonedx
          output: sbom.cyclonedx.json
          exit-code: '0'
          skip-setup-trivy: true
          cache: 'false'
          cache-dir: /var/tmp/trivy-cache

      - name: Attach reports to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.VERSION }}"
          # The manifests release workflow creates the release as draft in parallel; wait for it.
          for i in $(seq 1 30); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 20
          done
          gh release upload "$TAG" trivy-report.json sbom.cyclonedx.json --clobber

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only publish once image and reports are attached. If the image
          # build or scan failed, the release stays draft (never goes public).
          gh release edit "${{ steps.version.outputs.VERSION }}" --draft=false